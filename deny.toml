[graph]
all-features = true

[advisories]
version = 2
yanked = "deny"
ignore = [
    # SQLite bundled by libsqlite3-sys < 0.39; sqlx-sqlite 0.9 caps it below 0.38.
    # Exposure needs a database/-wal file written by a less trusted party; the server
    # only opens its own guardian.db in its private data directory. Drop this when
    # sqlx allows libsqlite3-sys >= 0.39.
    { id = "RUSTSEC-2026-0459", reason = "server opens only its own database; sqlx pins libsqlite3-sys < 0.38" },
    # zbus, zbus_names, zvariant: unmaintained (not vulnerable). Pulled only by
    # accesskit_unix (screen-reader support) in guardian-console's Linux build;
    # the console ships for Windows, where accesskit uses UI Automation instead.
    { id = "RUSTSEC-2026-0370", reason = "unmaintained zbus crates, Linux-only accessibility path of a Windows app" },
    { id = "RUSTSEC-2026-0371", reason = "unmaintained zbus crates, Linux-only accessibility path of a Windows app" },
    { id = "RUSTSEC-2026-0372", reason = "unmaintained zbus crates, Linux-only accessibility path of a Windows app" },
]

[licenses]
version = 2
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "Unicode-3.0",
    "CDLA-Permissive-2.0",
]
confidence-threshold = 0.9
# egui's bundled fonts (Ubuntu, Noto, emoji-icon-font): permissive font licenses,
# allowed for that crate only.
exceptions = [
    { crate = "epaint_default_fonts", allow = ["OFL-1.1", "Ubuntu-font-1.0"] },
]
unused-allowed-license = "allow"

[bans]
multiple-versions = "allow"
wildcards = "allow"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
