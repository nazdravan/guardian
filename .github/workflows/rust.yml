name: rust

on:
  push:
    paths:
      - "crates/**"
      - "proto/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - "deny.toml"
      - "packaging/agent-linux-v3/**"
      - ".github/workflows/rust.yml"
  pull_request:
    paths:
      - "crates/**"
      - "proto/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - "deny.toml"
      - "packaging/agent-linux-v3/**"
      - ".github/workflows/rust.yml"

env:
  CARGO_TERM_COLOR: always

jobs:
  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets --all-features -- -D warnings
      # The real server + agent + CLI test needs every binary.
      - run: cargo build --workspace --bins
      - run: cargo test --workspace --all-features
      - run: cargo test -p guardian-agent --test real_linux
      - run: cargo test -p guardian-console --test real_embedded
      - run: sh -n packaging/agent-linux-v3/install.sh && sh -n packaging/agent-linux-v3/uninstall.sh
      # As root: the proc connector delivers real exec events.
      - run: sudo -E env "PATH=$PATH" cargo test -p guardian-platform --features testing --test linux -- --include-ignored

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: i686-pc-windows-msvc
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --workspace
      # GitHub's Windows runners are administrators, so the ETW test runs too.
      - run: cargo test -p guardian-core -p guardian-proto -p guardian-platform --features guardian-platform/testing -- --include-ignored
      - run: cargo test -p guardian-agent
      - run: cargo test -p guardian-console --features testing
      - run: cargo build --release -p guardian-agent -p guardian-worker --target x86_64-pc-windows-msvc
      - run: cargo build --release -p guardian-agent -p guardian-worker --target i686-pc-windows-msvc
      - run: cargo build --release -p guardian-console --target i686-pc-windows-msvc
      - uses: actions/upload-artifact@v4
        with:
          name: console-windows
          path: target/i686-pc-windows-msvc/release/guardian-console.exe
      - uses: actions/upload-artifact@v4
        with:
          name: agent-windows
          path: |
            target/x86_64-pc-windows-msvc/release/guardian-agent.exe
            target/x86_64-pc-windows-msvc/release/guardian-worker.exe
            target/i686-pc-windows-msvc/release/guardian-agent.exe
            target/i686-pc-windows-msvc/release/guardian-worker.exe

  deny:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: EmbarkStudios/cargo-deny-action@v2
