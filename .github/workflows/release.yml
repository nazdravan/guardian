# Builds the Guardian 3.0 archive on every push to main, and publishes it as a
# GitHub Release only when ./VERSION names a version that has no tag yet.
#
#   guardian-<version>.zip
#     server-linux/  server-windows/  console-windows/  agent-windows/  agent-linux/
#
# Linux binaries come from the linux job, Windows ones (64-bit server, CLI and
# agent; 32-bit agent, console and setup) from the windows job; the package job
# packs them with scripts/package.sh. To ship a release: bump VERSION and push
# to main. Any other push just rebuilds and keeps the zip as a run artifact.
name: release

on:
  push:
    branches: [main]

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always

jobs:
  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --workspace --bins
      - run: cargo test --workspace --all-features
      - run: cargo build --release -p guardian-server -p guardian-cli -p guardian-agent -p guardian-worker
      - name: Collect the Linux binaries
        run: |
          mkdir -p bin-linux
          cp target/release/guardian-server target/release/guardian-cli \
             target/release/guardian-agent target/release/guardian-worker bin-linux/
      - uses: actions/upload-artifact@v4
        with:
          name: bin-linux
          path: bin-linux/

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc, i686-pc-windows-msvc
      - uses: Swatinem/rust-cache@v2
      - run: cargo test -p guardian-setup --features testing
      - run: cargo test -p guardian-console --features testing
      - run: cargo build --release -p guardian-server -p guardian-cli -p guardian-agent -p guardian-worker --target x86_64-pc-windows-msvc
      - run: cargo build --release -p guardian-agent -p guardian-worker -p guardian-console -p guardian-setup --target i686-pc-windows-msvc
      - name: Collect the Windows binaries
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force bin-win64, bin-win32 | Out-Null
          foreach ($n in 'guardian-server', 'guardian-cli', 'guardian-agent', 'guardian-worker') {
            Copy-Item "target/x86_64-pc-windows-msvc/release/$n.exe" bin-win64/
          }
          foreach ($n in 'guardian-agent', 'guardian-worker', 'guardian-console', 'guardian-setup') {
            Copy-Item "target/i686-pc-windows-msvc/release/$n.exe" bin-win32/
          }
      # Authenticode only with a certificate in the secrets; without one the
      # binaries ship unsigned and the run says so.
      - name: Sign the Windows binaries
        shell: pwsh
        env:
          WINDOWS_CERT_PFX_BASE64: ${{ secrets.WINDOWS_CERT_PFX_BASE64 }}
          WINDOWS_CERT_PASSWORD: ${{ secrets.WINDOWS_CERT_PASSWORD }}
        run: |
          if (-not $env:WINDOWS_CERT_PFX_BASE64) {
            Write-Output "::warning::No WINDOWS_CERT_PFX_BASE64 secret: the Windows binaries are not signed."
            exit 0
          }
          $pfx = Join-Path $env:RUNNER_TEMP 'cert.pfx'
          [IO.File]::WriteAllBytes($pfx, [Convert]::FromBase64String($env:WINDOWS_CERT_PFX_BASE64))
          $signtool = Get-ChildItem "${env:ProgramFiles(x86)}\Windows Kits\10\bin" -Recurse -Filter signtool.exe |
            Where-Object { $_.FullName -match '\\x64\\' } | Select-Object -Last 1
          Get-ChildItem bin-win64/*.exe, bin-win32/*.exe | ForEach-Object {
            & $signtool.FullName sign /f $pfx /p $env:WINDOWS_CERT_PASSWORD /fd SHA256 /tr http://timestamp.digicert.com /td SHA256 $_.FullName
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }
          Remove-Item $pfx
      - uses: actions/upload-artifact@v4
        with:
          name: bin-win64
          path: bin-win64/
      - uses: actions/upload-artifact@v4
        with:
          name: bin-win32
          path: bin-win32/

  package:
    needs: [linux, windows]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Read VERSION
        id: version
        run: |
          v="$(tr -d '[:space:]' < VERSION)"
          echo "version=$v" >> "$GITHUB_OUTPUT"
          if git rev-parse -q --verify "refs/tags/$v" >/dev/null; then
            echo "release=false" >> "$GITHUB_OUTPUT"
            echo "Tag $v exists: building without publishing."
          else
            echo "release=true" >> "$GITHUB_OUTPUT"
            echo "New version $v: will publish a release."
          fi

      - uses: actions/download-artifact@v4
        with:
          path: bins

      - name: Pack the archive
        run: |
          chmod +x bins/bin-linux/*
          bash scripts/test-package.sh
          ./scripts/package.sh --linux bins/bin-linux --win64 bins/bin-win64 --win32 bins/bin-win32 --out dist

      - uses: actions/upload-artifact@v4
        with:
          name: guardian-${{ steps.version.outputs.version }}
          path: dist/guardian-${{ steps.version.outputs.version }}.zip

      - name: Publish the release
        if: steps.version.outputs.release == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          V: ${{ steps.version.outputs.version }}
        run: |
          gh release create "$V" "dist/guardian-$V.zip" \
            --title "Guardian $V" --target "$GITHUB_SHA" --generate-notes
