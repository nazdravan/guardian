[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
edition = "2024"
rust-version = "1.95"
license = "MIT"
version = "3.0.0-dev"

[workspace.lints.rust]
unsafe_code = "deny"

[workspace.lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"

[workspace.dependencies]
guardian-core = { path = "crates/guardian-core" }
guardian-proto = { path = "crates/guardian-proto" }
guardian-server = { path = "crates/guardian-server" }
guardian-client = { path = "crates/guardian-client" }
guardian-platform = { path = "crates/guardian-platform" }
guardian-agent = { path = "crates/guardian-agent" }
guardian-worker = { path = "crates/guardian-worker" }
guardian-console = { path = "crates/guardian-console" }
guardian-local = { path = "crates/guardian-local" }

tokio = { version = "1.54", features = ["rt-multi-thread", "macros", "net", "time", "sync", "signal", "fs", "io-util"] }
tokio-stream = { version = "0.1", features = ["sync", "net"] }
futures-util = "0.3"
tonic = "0.14"
tonic-prost = "0.14"
tonic-prost-build = "0.14"
tonic-reflection = "0.14"
prost = "0.14"
protox = "0.10"
axum = { version = "0.8", default-features = false, features = ["ws", "http1", "http2", "tokio", "matched-path", "original-uri", "query", "tracing"] }
tower = "0.5"
hyper = "1"
hyper-util = { version = "0.1", features = ["tokio", "server", "server-auto", "server-graceful", "service"] }
sqlx = { version = "0.9", default-features = false, features = ["runtime-tokio", "sqlite-bundled", "migrate", "macros"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12", "logging"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12"] }
rcgen = "0.14"
rustls-native-certs = "0.8"
rustls-pki-types = { version = "1", features = ["std"] }
gethostname = "1"
ed25519-dalek = "3"
snow = "0.10"
argon2 = "0.6"
sha2 = "0.11"
rand = "0.10"
getrandom = "0.4"
base64 = "0.22"
hex = "0.4"
serde_json = "1"
clap = { version = "4.6", features = ["derive", "env"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
thiserror = "2"
anyhow = "1"
uuid = { version = "1", features = ["v4"] }
zeroize = "1.9"
tokio-tungstenite = { version = "0.30", features = ["rustls-tls-native-roots"] }
tempfile = "3"
assert_cmd = "2"
predicates = "3"
toml = "1"
rpassword = "7"
serde = { version = "1", features = ["derive"] }
windows-service = "0.8"
async-trait = "0.1"
if-addrs = "0.15"
nix = { version = "0.32", features = ["signal", "socket", "uio", "user", "process"] }
ferrisetw = "1.2"
netlink-sys = { version = "0.8", default-features = false }
windows = { version = "0.62", features = ["Win32_Foundation", "Win32_System_Diagnostics_ToolHelp", "Win32_System_Threading", "Win32_System_ProcessStatus", "Win32_System_RemoteDesktop", "Win32_Security", "Win32_Security_Authorization", "Win32_System_Environment", "Win32_System_Pipes", "Win32_System_IO", "Win32_System_Console"] }
egui = "0.37"
eframe = { version = "0.37", default-features = false, features = ["default_fonts", "accesskit", "wgpu", "glow", "x11", "wayland"] }
egui_kittest = "0.37"
rfd = "0.17"
winresource = "0.1"

[profile.dev.package.argon2]
opt-level = 3

[profile.dev.package.blake2]
opt-level = 3

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
