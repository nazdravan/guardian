[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
edition = "2024"
rust-version = "1.85"
license = "MIT"
version = "3.0.0-dev"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"

[workspace.dependencies]
guardian-core = { path = "crates/guardian-core" }
guardian-proto = { path = "crates/guardian-proto" }
guardian-server = { path = "crates/guardian-server" }
guardian-client = { path = "crates/guardian-client" }

tokio = { version = "1.54", features = ["rt-multi-thread", "macros", "net", "time", "sync", "signal", "fs", "io-util"] }
tokio-stream = { version = "0.1", features = ["sync", "net"] }
futures-util = "0.3"
tonic = "0.14"
tonic-prost = "0.14"
tonic-prost-build = "0.14"
tonic-reflection = "0.14"
prost = "0.14"
protox = "0.10"
axum = { version = "0.8", default-features = false, features = ["ws", "http1", "http2", "tokio", "matched-path", "original-uri", "query", "tracing"] }
tower = "0.5"
hyper = "1"
hyper-util = { version = "0.1", features = ["tokio", "server", "server-auto", "server-graceful", "service"] }
sqlx = { version = "0.9", default-features = false, features = ["runtime-tokio", "sqlite-bundled", "migrate", "macros"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12", "logging"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12"] }
rcgen = "0.14"
ed25519-dalek = "3"
argon2 = "0.6"
sha2 = "0.11"
rand = "0.10"
getrandom = "0.4"
base64 = "0.22"
hex = "0.4"
serde_json = "1"
governor = "0.10"
clap = { version = "4.6", features = ["derive", "env"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
thiserror = "2"
anyhow = "1"
uuid = { version = "1", features = ["v4"] }
zeroize = "1.9"
tokio-tungstenite = "0.30"
tempfile = "3"
assert_cmd = "2"

[profile.dev.package.argon2]
opt-level = 3

[profile.dev.package.blake2]
opt-level = 3

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
