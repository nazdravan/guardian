syntax = "proto3";

package guardian.v1;

enum Mode {
  MODE_UNSPECIFIED = 0;
  MODE_FREE = 1;
  MODE_BLACKLIST = 2;
  MODE_WHITELIST = 3;
}

message Profile {
  int64 id = 1;
  string name = 2;
  Mode mode = 3;
  repeated string apps = 4;
}

message AgentState {
  uint64 version = 1;
  int64 effective_profile_id = 2;
  repeated Profile profiles = 3;
  // 0 = no room.
  int64 room_id = 4;
}

message MessageCmd {
  string title = 1;
  string text = 2;
}

message ProgramStartCmd {
  string path = 1;
  repeated string args = 2;
}

message SiteOpenCmd {
  string url = 1;
}

message ShutdownCmd {
  uint32 countdown_seconds = 1;
}

message RestartCmd {
  uint32 countdown_seconds = 1;
}

// File commands are added in stage 4 as new variants.
message Command {
  oneof kind {
    MessageCmd message = 1;
    ProgramStartCmd program_start = 2;
    SiteOpenCmd site_open = 3;
    ShutdownCmd shutdown = 4;
    RestartCmd restart = 5;
  }
}

message CommandEnvelope {
  // UUID.
  string id = 1;
  int64 expires_at_unix = 2;
  Command command = 3;
}

enum ResultStatus {
  RESULT_STATUS_UNSPECIFIED = 0;
  RESULT_PENDING = 1;
  RESULT_DELIVERED = 2;
  RESULT_OK = 3;
  RESULT_FAILED = 4;
  RESULT_NO_USER = 5;
  RESULT_UNSUPPORTED = 6;
  RESULT_EXPIRED = 7;
}

message CommandResult {
  string command_id = 1;
  ResultStatus status = 2;
  string detail = 3;
}
