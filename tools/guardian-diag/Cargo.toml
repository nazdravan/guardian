[workspace]
resolver = "3"
members = ["crates/*", "apps/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.91"
license = "MIT"

[workspace.dependencies]
guardian-core = { path = "crates/core" }
guardian-winhost = { path = "crates/winhost" }
guardian-ui = { path = "crates/ui-egui" }

serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
sha2 = "0.10"
chrono = { version = "0.4", default-features = false, features = ["std", "clock", "serde"] }
roxmltree = "0.20"
ureq = { version = "3.4", default-features = false, features = ["rustls-no-provider", "_ring"] }
rustls-native-certs = "0.8"
windows-service = "0.8"
winreg = "0.55"
is_elevated = "0.1"
egui = "0.36"
eframe = { version = "0.36", default-features = false, features = ["glow", "default_fonts", "accesskit"] }
egui_kittest = "0.36"
rfd = "0.17"
tempfile = "3"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
dbg_macro = "warn"
todo = "warn"

[profile.release]
lto = "thin"
codegen-units = 1
opt-level = "s"
