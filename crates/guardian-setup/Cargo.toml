[package]
name = "guardian-setup"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "Guardian 3.0 agent installer and diagnostics for Windows"

[[bin]]
name = "guardian-setup"
path = "src/main.rs"

[features]
# FakeHost for tests.
testing = ["dep:tempfile"]

[dependencies]
guardian-core.workspace = true
guardian-agent.workspace = true
guardian-platform.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
clap.workspace = true
tracing.workspace = true
egui.workspace = true
eframe.workspace = true
rfd.workspace = true
guardian-applog.workspace = true
tempfile = { workspace = true, optional = true }

[target.'cfg(windows)'.dependencies]
windows-service.workspace = true

[target.'cfg(windows)'.build-dependencies]
winresource.workspace = true

[dev-dependencies]
egui_kittest.workspace = true
guardian-setup = { path = ".", features = ["testing"] }
serde_json.workspace = true

[lints]
workspace = true
